name: Graphics validation

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

# No PAT or repository secrets are needed; no pull_request_target execution.
permissions:
  contents: read
  actions: read

concurrency:
  group: graphics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Pure JS + Chromium + UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: build/toolchains
          key: graphics-${{ runner.os }}-${{ runner.arch }}-browser-v1-${{ hashFiles('tools/bootstrap.sh', 'patches/*.patch') }}
      - name: Bootstrap pinned Nim and fossil UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          ./tools/bootstrap.sh nim 2>&1 | tee build/ci-bootstrap-nim.log
          ./tools/bootstrap.sh ui 2>&1 | tee build/ci-bootstrap-ui.log
          npm ci
      - name: CPU tests and pure JS builds
        shell: bash
        run: |
          set -euo pipefail
          export NIM="$PWD/build/toolchains/Nim/bin/nim"
          export FOSSIL_SRC="$PWD/build/toolchains/fossil/src"
          ./tools/test.sh 2>&1 | tee build/ci-js.log
      - name: Cross-browser application bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-test-bundle
          retention-days: 7
          path: |
            build/*.js
            build/*.html
      - name: Browser GPU, lifecycle, UI, timing and autoscale
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 0.0.0.0 --directory build >build/ci-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tools/wait_http.cjs http://127.0.0.1:8080/gpu-test.html
          kill -0 "$server"
          TEST_UI=1 USE_BUNDLED_LIBS=1 node tools/browser_test.cjs 2>&1 | tee build/ci-browser.log
          USE_BUNDLED_LIBS=1 node tools/autoscale_test.cjs 2>&1 | tee build/ci-autoscale.log
          USE_BUNDLED_LIBS=1 node tools/timing_test.cjs 2>&1 | tee build/ci-timing.log
      - name: Workload browser report
        run: python3 tools/collect_workloads.py browser
      - name: Browser failure diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          for name in ('ci-js.log', 'ci-browser.log', 'ci-autoscale.log', 'ci-timing.log'):
              path = Path('build') / name
              if path.exists():
                  text = '\n'.join(path.read_text(errors='replace').splitlines()[-35:])[-8000:]
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={name}::{text}')
          PYDIAG
      - name: Browser evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: browser-evidence
          retention-days: 14
          path: |
            build/ci-*.log
            build/*.png
            build/timing-report.json
            build/workload-browser.json

  native:
    name: GCC + LLVM + cproc-QBE / GLES2-3
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '22'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: build/toolchains
          key: graphics-${{ runner.os }}-${{ runner.arch }}-native-v1-${{ hashFiles('tools/bootstrap.sh', 'patches/*.patch') }}
      - name: Bootstrap compilers and ANGLE SwiftShader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for component in nim cproc llvm native-driver; do
            ./tools/bootstrap.sh "$component" 2>&1 | tee "build/ci-bootstrap-$component.log"
          done
      - name: Native debug, release and ARM64 cross-link
        run: ./tools/ci_native.sh
      - name: Workload native report
        run: python3 tools/collect_workloads.py native
      - name: SDL window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri xvfb xauth openbox xdotool x11-utils
      - name: SDL GLES windows (GCC, LLVM, QBE)
        run: ./tools/test_window.sh
      - name: Native failure diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          paths = list(Path('build').glob('ci-window-*.log'))
          paths += [Path('build') / name for name in ('ci-native-debug.log', 'ci-cproc-debug.log')]
          for path in sorted(p for p in paths if p.exists()):
              text = '\n'.join(path.read_text(errors='replace').splitlines()[-30:])[-7000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={path.name}::{text}')
          PYDIAG
      - name: Native evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: native-evidence
          retention-days: 14
          path: |
            build/ci-*.log
            build/native-report.json
            build/workload-native.json

  cross-browser:
    name: WebGL / ${{ matrix.engine }} / ${{ matrix.os }}
    needs: browser
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: firefox
            os: ubuntu-24.04
          - engine: webkit
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Download identical pure-JS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name web-test-bundle --dir build
      - name: Install pinned browser engine
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Pixel oracles, workloads, resize fuzz and diagnostics
        shell: bash
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 0.0.0.0 --directory build >build/cross-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tools/wait_http.cjs http://127.0.0.1:8080/gpu-test.html
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node tools/cross_browser_test.cjs 2>&1 | tee build/cross-browser.log
          else
            node tools/cross_browser_test.cjs 2>&1 | tee build/cross-browser.log
          fi
      - name: Cross-browser evidence (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-${{ matrix.engine }}-${{ runner.arch }}
          retention-days: 14
          path: |
            build/cross-*.json
            build/cross-*.log
            build/debug-*.json
            build/*.png
